    <section class="gallery">
      <!-- Kort 1 -->
      <div class="card"id="vinterlandskap">
         <a class="media-link" href="#vinterlandskap" aria-label="Se målningen Vinterlandskap">
          <figure class="media" style="--fx:60%; --fy:35%;">
           <img src="./målningar/målning1.jpeg" alt="Vinterlandskap – snöigt landskap">
          </figure>
         <figcaption class="meta">
          <div class="title">Vinterlandskap</div>
          <div class="price">20 000 SEK</div>
        </figcaption>
        </a>
         <button class="add-to-cart"

           data-price="20000"

        </button>
       </div>

          <figcaption class="meta">
           <div class="title">Ett Minne</div>

        <button class="add-to-cart"
