<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="./checkut.css">
</head>
<body>

<main class="checkout-container">
  <h1>Gå till kassa</h1>

  <form id="checkout-form">
    <label for="name">Namn:</label>
    <input type="text" id="name" name="name" required>

    <label for="address">Adress:</label>
    <input type="text" id="address" name="address" required>

    <label for="email">E-post:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Telefon:</label>
    <input type="tel" id="phone" name="phone">

    <h3>Betalningsmetod:</h3>
    <label><input type="radio" name="payment" value="card" required> Kort</label>
    <label><input type="radio" name="payment" value="bank"> Banköverföring</label>

    <div class="cart-summary">
      <h3>Sammanfattning av din kundvagn</h3>
      <div id="cart-summary-items">
       <p id="checkout-item-count">Antal varor: 0</p>
       <p id="checkout-total">Totalt: 0 SEK</p>

      </div>
    </div>

    <button type="submit">Slutför köp</button>
  </form>

</main>

<script src="./checkut.js" defer></script>
<script src="./cart.js" defer></script>

</body>
</html>
